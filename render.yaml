services:
  - type: web
    name: agribridge-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx tsc --version && npm run build:prod
    startCommand: npm run prisma:deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PAYMENT_PROVIDER
        value: MOCK
      - key: GEMINI_API_KEY
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
